<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>Newsletter</title>
<style>
  body { margin: 0; padding: 0; background-color: #f2f4f7; }
  .wrapper { width: 100%; background-color: #f2f4f7; }
  .container { width: 600px; max-width: 600px; background-color: #ffffff; }
  .header { padding: 24px 32px; background-color: #1d3557; color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; }
  .content { padding: 32px; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; color: #1f2937; }
  .content h1, .content h2 { color: #1d3557; line-height: 1.3; }
  .content a { color: #1d6fb8; }
  .footer { padding: 24px 32px; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.5; color: #6b7280; text-align: center; }
  .footer a { color: #6b7280; }
  @media only screen and (max-width: 620px) {
    .container { width: 100% !important; }
    .content, .header, .footer { padding: 20px !important; }
  }
</style>
</head>
<body>
{{preheader}}
<table role="presentation" class="wrapper" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" style="padding: 24px 8px;">
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0">
        <tr><td class="header">Your Company</td></tr>
        <tr>
          <td class="content">
            <p>Hi {{first_name|there}},</p>
            {{content}}
          </td>
        </tr>
      </table>
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: transparent;">
        <tr>
          <td class="footer">
            You are receiving this email because you are on our mailing list.<br>
            <a href="{{view_in_browser_url}}">View in browser</a> &middot; <a href="{{unsubscribe_url}}">Unsubscribe</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
