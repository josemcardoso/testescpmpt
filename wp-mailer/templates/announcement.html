<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcement</title>
<style>
  body { margin: 0; padding: 0; background-color: #fff7ed; }
  .container { width: 560px; max-width: 560px; background-color: #ffffff; border-radius: 8px; }
  .hero { padding: 40px 32px 8px; font-family: Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1.2; color: #9a3412; text-align: center; }
  .content { padding: 16px 32px 32px; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; color: #292524; text-align: center; }
  .button { display: inline-block; padding: 14px 28px; background-color: #ea580c; color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-weight: bold; text-decoration: none; border-radius: 6px; }
  .footer { padding: 20px; font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #78716c; text-align: center; }
  .footer a { color: #78716c; }
  @media only screen and (max-width: 600px) {
    .container { width: 100% !important; border-radius: 0 !important; }
    .hero { font-size: 24px !important; }
  }
</style>
</head>
<body>
{{preheader}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #fff7ed;">
  <tr>
    <td align="center" style="padding: 32px 8px;">
      <table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" border="0">
        <tr><td class="hero">Big news, {{first_name|friend}}!</td></tr>
        <tr><td class="content">{{content}}</td></tr>
        <tr>
          <td align="center" style="padding: 0 32px 40px;">
            <a class="button" href="https://example.com">Find out more</a>
          </td>
        </tr>
      </table>
      <p class="footer"><a href="{{unsubscribe_url}}">Unsubscribe</a></p>
    </td>
  </tr>
</table>
</body>
</html>
